# Deploys the site to the live server over SFTP on every push to master.
# Same setup as herdubreid-klifur (same server, same secret names).
name: Deploy to live server

on:
  push:
    branches:
      - master
  workflow_dispatch: # run by hand from the Actions tab

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  sftp-deploy:
    name: SFTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.vscode' \
            --exclude='.DS_Store' \
            --exclude='deploy' \
            ./ deploy/
          echo "Files to upload:" && find deploy -type f | wc -l

      # lftp mirror creates missing folders on the server (the old sftp "put -r"
      # step failed on new folders like art/, images2/ and redesign/).
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "sftp://$FTP_SERVER:$FTP_PORT" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 ./deploy/ '$FTP_SERVER_DIR';
            bye
          "
