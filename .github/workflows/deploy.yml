# Deploys the site to the live server over SFTP on every push to master.
# Same setup as herdubreid-klifur (same server, same secret names).
name: Deploy to live server

on:
  push:
    branches:
      - master
  workflow_dispatch: # run by hand from the Actions tab

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  sftp-deploy:
    name: SFTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='.codekit-cache' \
            --exclude='config.codekit' \
            --exclude='art/faedinga-greidsluaae-26-02-2026.pdf' \
            --exclude='deploy' \
            ./ deploy/
          # Recommended: keep the old risky scripts off the server by adding
          #   --exclude='resources/uploadFile.php' --exclude='resources/phpinfooo.php' --exclude='resources/error_log'
          echo "Files to upload:" && find deploy -type f | wc -l

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          local_path: './deploy/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftp_only: true
